# ============================================================
# CryptoArbitrage — конфигурация (Phase 1, WS-издание)
# Все пороги и параметры меняются здесь, без правки кода.
# ============================================================

exchanges:
  - bybit
  - okx
  - gateio
  - binance
  - bitget
  - mexc
  - kucoin
  - htx
  - bingx

# Периодическое обновление списка пар (delisting/новые)
symbols_refresh_hours: 6

# ---------------- Фильтры каталога ----------------
filters:
  # Минимум бирж, на которых должна быть монета, чтобы попасть в работу
  min_common_exchanges: 2
  # Исключить по базовой монете (напр. [BTC, ETH, SOL]) — исключаем мегакапы,
  # так как их спреды (~0.05%) не покрывают комиссию тейкера
  exclude_bases: [BTC, ETH, SOL]
  # Точечное исключение конкретных символов
  exclude_symbols: []

# Куда писать отчёты/каталог
output_dir: output

# ---------------- Рыночные данные ----------------
market:
  # Свежесть котировки. WS-коннекты у части бирж нестабильны (таймауты),
  # данные идут через REST-фолбэк с интервалом ~1с; при троттлинге
  # rate-limit котировки могут стареть — терпим до 15с.
  # (анти-фантом держит max_leg_dt_sec: ноги должны быть сняты близко)
  staleness_sec: 15
  # Макс. расхождение времён двух ног (иначе спред «фантомный»)
  max_leg_dt_sec: 7.0
  # Отсечка выбросов: спред выше этого считаем битой котировкой
  # (перекрёстный/замороженный стакан, делистинг) — не торгуем
  max_sane_spread_pct: 3.0
  # Мин. нотионал на вершине книги обеих ног, иначе спред неторгуемый
  min_top_notional_usdt: 20
  # Защита от одноимённых РАЗНЫХ токенов (один тикер, разные монеты):
  # средняя цена котировки, отклонившаяся от медианы по биржам больше
  # чем на этот %, выбрасывается из сравнения. У настоящего токена цена
  # на биржах не может расходиться в разы.
  price_sanity_deviation_pct: 50
  # Funding тянется REST-ом раз в N секунд (он меняется редко, WS избыточен)
  funding_refresh_sec: 300
  # Глубина стакана для оценки slippage / исполнения ног
  orderbook_depth: 20
  # Кэш стакана: не дёргать REST чаще этого интервала на пару биржа/символ
  orderbook_ttl_sec: 2.0
  # Максимум одновременных REST-запросов стакана
  orderbook_concurrency: 8

# ---------------- Статистический Z-Score арбитраж ----------------
# Основная стратегия: возврат к среднему при экстремальных расхождениях (|Z| >= 4.0).
# Поддерживает мгновенный прогрев из архива минутных свечей (1440 минут = 24 часа).
zscore:
  enabled: true
  # Порог входа по Z-Score (4 сигмы от 24ч средней)
  entry_z: 3.5
  # Порог схождения (выход при пересечении нуля или <= exit_z)
  exit_z: 0.0
  # Стоп-лосс по расширению аномалии (|Z| >= stop_mult * entry_z)
  stop_mult: 2.0
  # Тайм-стоп удержания (секунды, 1800с = 30 минут)
  timestop_sec: 1800
  # Минимальная чистая маржа прибыли сверх всех 4 комиссий тейкера (%)
  min_profit_margin_pct: 0.10
  # Окно расчета EMA и STD в минутах (1440 = 24 часа)
  period: 1440

# ---------------- Сбор фандинга (Funding Arbitrage) ----------------
funding_arb:
  enabled: true
  # Минимальная чистая разница ставок фандинга за 8 часов (%)
  # 0.08% за 8ч = 0.24% в сутки = 87.6% годовых (APR)
  min_funding_diff_8h_pct: 0.08
  # Максимальное расхождение спот/фьючерс цен между биржами на входе (%)
  max_raw_spread_pct: 0.20
  # Фиксированный размер виртуальной позиции ($10 = $1 маржа с 10x плечом)
  position_size_usdt: 10.0
  # Максимальный горизонт удержания (часы, 72ч = 3 дня = 9 начислений фандинга)
  max_holding_hours: 72.0
  # Защитный стоп-лосс при сильном расхождении цен (%)
  spread_stop_pct: 2.0

# ---------------- Межмонетный парный арбитраж (Cross-Coin Pairs Trading) ----------------
cross_coin:
  enabled: true
  # Порог входа по Z-Score синтетического соотношения цен (сигмы)
  entry_z: 2.5
  # Порог выхода при возврате к средней
  exit_z: 0.0
  # Размер позиции на ногу ($10 = $1 маржа с 10x плечом)
  position_size_usdt: 10.0
  # Реестр проверенных пар после суточной Walk-Forward рекалибровки
  registry_file: "output/active_cross_pairs.json"
  recalibration:
    enabled: true
    interval_hours: 24.0
    run_at_utc_hour: 0
    top_pairs: 6
    min_wfe_pct: 50.0

# ---------------- Сканер ----------------
scan:
  # Период прохода по всем символам (мс). Для скальпа важно быстро
  # видеть появление спреда: 200мс разумный минимум (CPU лёгкий,
  # узкое место — REST за стаканом, он кэширован).
  interval_ms: 200
  # Предфильтр по сырому спреду (best bid/ask): только пары выше этого
  # идут за стаканом и полным расчётом. Держи < min_threshold_pct.
  prefilter_pct: 0.05
  # Троттлинг записи сигналов в лог/БД на пару (символ, лонг, шорт)
  signal_log_throttle_sec: 5

# ---------------- Направленный lead-lag (одна нога) ----------------
# Фронт-ран отстающей биржи: лидер двинулся, лаггер ещё на старой цене.
# Вход ОДНОЙ ногой на лаггере по направлению к лидеру:
#   отстала дешёвая -> ЛОНГ (догонит вверх)
#   отстала дорогая -> ШОРТ (догонит вниз)
# Комиссии 2x taker (0.12%) — вдвое дешевле арбитража.
# Цена риска: отклонение может быть реальной переоценкой, а не лагом —
# поэтому стоп-лосс обязателен.
dir:
  # БЭКТЕСТ на 13149 сигналах: 791 сделка, TP всего 4.8% (38), таймаут
  # 94% (747), средний PnL -0.07%/сделка, суммарно -55%. Вывод: спреды
  # на этих монетах НЕ сходятся за 90с — «лаг» структурный, а не лаг.
  # Выключено до появления идей (другая вселенная монет / латентность).
  enabled: false
  # Мин. спред (отклонение) для входа, %
  min_spread_pct: 0.3
  # Мин. разница возрастов котировок ног, с — иначе непонятно, кто лидер
  min_lag_sec: 0.2
  # Тейк: спред сжался до exit_frac от входного
  exit_frac: 0.3
  # Стоп: спред вырос в stop_mult раз от входного
  stop_mult: 2.0
  # Тайм-стоп
  max_holding_sec: 90

# ---------------- Скальп-режим ----------------
# Для спредов, которые мелькают на секунды (lead-lag медленных бирж):
# вход как обычно, но выход — при сжатии спреда до доли входного
# либо по жёсткому тайм-стопу. Funding на таких горизонтах ~0.
scalp:
  # Выключено в пользу Z-Score стратегии с доказанным математическим преимуществом
  enabled: false
  # Закрыть, когда спред сжался до exit_spread_frac от входного
  # (0.3 = спред сжался на 70% — забираем схождение, не ждём нуля)
  exit_spread_frac: 0.3
  # Тайм-стоп: не сжался за это время — выходим (спред был фантомным
  # или сошёлся против нас; дальше держать = направленный риск)
  max_holding_sec: 90
  # РАЗДЕЛЕНИЕ СТРАТЕГИЙ: входной спред < этой величины -> СКАЛЬП
  # (быстрый выход на сжатии), >= -> ПОЗИЦИОННЫЙ АРБИТРАЖ
  # (ждём схождения, выход по net_edge/таймауту часов).
  # У каждой стратегии своя статистика и отчётность.
  max_entry_spread_pct: 1.0
  # ---- МИНИМАЛЬНЫЙ ЗАХВАТ (экономика) ----
  # Полный цикл = 2 ноги x вход+выход = 4 x taker (~0.24%) +
  # slippage/ширина (~0.06%) => кост-флор ~0.30%.
  # Средний захват монеты (capture_sum/converged из статистики) должен
  # быть ВЫШЕ этой величины, иначе после комиссий сделка уходит в минус.
  # Пример из реальных данных: UNITREE capture 0.48% -> нетто +0.24% (берём),
  # TRUMP capture 0.21% -> нетто -0.03% (не берём).
  min_capture_pct: 0.30
  # ---- АВТО-WATCHLIST: скальпим только отобранные монеты ----
  # auto = вход только у топ-N монет по score (частота спайков ×
  # сходимость × захват), all = любая монета
  watchlist_mode: auto
  watchlist_top: 15
  # минимум наблюдений, чтобы монета попала в рейтинг
  watchlist_min_spikes: 5
  # что считаем спайком (сырой спред, %)
  spike_min_spread_pct: 0.3
  # спайк считается СОШЕДШИМСЯ, если спред сжался до этой доли
  convergence_frac: 0.5
  # и не позже этого окна
  convergence_window_sec: 120

# ---------------- Расчёт net_edge ----------------
scoring:
  # Мин. net_edge% (после всех издержек) для валидного сигнала.
  # Держи заметно выше комиссий (0.20% round-trip), иначе сигнал
  # едва покрывает издержки и любой шум уводит в минус.
  min_threshold_pct: 0.30
  # Горизонт удержания для нормализации funding при СКОРИНГЕ (часы)
  assumed_holding_hours: 8
  # Запас на проскальзывание сверх расчёта по стакану (%)
  slippage_buffer_pct: 0.02
  # ГЕЙТ ШИРИНЫ КНИГ для ARB-входа: на широких книгах реальный
  # кост-флор 0.5-0.7% (вход-walk + ширина выхода), и порог 0.30%
  # не отбивается. Ширина обеих книг больше этого -> не входим.
  # Тонкие/широкие монеты автоматически отсекаются.
  max_book_width_pct: 0.3
  # ПРАВИЛО СООТНОШЕНИЯ: funding_edge не может быть главным драйвером.
  # funding > 15% спреда => спред скорее всего сам есть цена
  # funding-дифференциала и сходиться не будет. Примеры:
  #   спред 1% + funding 1%  -> ОТКАЗ (100%)
  #   спред 3% + funding 1%  -> ОТКАЗ (33%)
  #   спред 10% + funding 1% -> отлично (10%)
  funding_max_share_of_spread: 0.15

# ---------------- Издержки по умолчанию ----------------
# Заглушки, если биржа не отдала комиссии в market info.
default_fees:
  taker: 0.0006
  maker: 0.0002

# ---------------- Эмулятор ----------------
emulator:
  enabled: true
  # РАЗМЕР ПОЗИЦИИ: dynamic = % от нотионала первых N уровней стакана
  # на худшей из двух ног (не двигаем книгу), fixed = константа
  position_size_mode: dynamic
  fixed_position_size_usdt: 1000
  dynamic_size_pct_of_book: 10
  dynamic_size_top_levels: 3
  # Ниже минимума не торгуем (издержки > смысла), выше максимума не ходим
  min_position_size_usdt: 10
  max_position_size_usdt: 1000
  # Слиппедж-кап входа: набираем размер только с уровней, отклонённых
  # от лучшей цены не больше этого %. Защита от глубокого прохода
  # тонких книг (главный источник потерь на 'жирных' спредах).
  max_entry_slippage_pct: 0.15
  # Таймаут ожидания второй ноги (зарезервировано; ноги проверяются сразу)
  orphan_leg_timeout_sec: 3
  # Кулдаун повторного открытия по той же тройке (символ, лонг, шорт)
  cooldown_sec: 60
  # МАКСИМУМ одновременных позиций на одну тройку. 1 = спред уже открыт
  # -> не дублируем (иначе устойчивый спред плодит клоны позиции)
  max_open_per_pair: 1
  # Кулдаун после УБЫТОЧНОГО закрытия той же тройки — защита от
  # перезаходов в висящий фантомный спред
  loss_cooldown_sec: 900
  # Принудительное закрытие позиции старше этого горизонта (часы)
  max_holding_hours: 72
  # Выход, когда net_edge упал ниже exit_frac * min_threshold_pct
  exit_threshold_frac: 0.5

# ---------------- Хранилище ----------------
storage:
  backend: sqlite
  sqlite_path: data/scanner.db
  # Ротация: удалять quotes/signals старше N дней
  retention_days: 30

# ---------------- Логи ----------------
logging:
  dir: logs
  retention_days: 90

# ---------------- Дашборд ----------------
dashboard:
  enabled: true
  host: 127.0.0.1
  port: 8080
